<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Server</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1c1c1c;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #bbb;
            line-height: 1.6;
        }

        .movie {
            margin: 25px 0;
            padding: 20px;
            background: #292929;
            border-radius: 12px;
        }

        .movie h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 22px;
            background: orange;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            opacity: 0.85;
        }

        .secondary {
            background: #555;
        }

        .note {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Movie Server</h1>

    <p>
        Click the button below to play the movie directly in the VLC app.
    </p>

    <div class="movie">

        <h2>Spider-Man: Brand New Day (2026)</h2>

        <p>
            HDTC • 720p • Multi Audio
        </p>

        <!-- VLC Android Intent -->
        <a
            class="button"
            href="intent://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282026%29/Spider-Man%20-%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V4%20%5BMulti%20Audio%5D/Spider-Man%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V3%20x264%20ESub%20%5BMulti%20Audio%5D%5BHindi%20%28Clean%29%2BEnglish%20CAM%2BMulti%20CAM%5D%20-HDHub.mkv#Intent;scheme=http;package=org.videolan.vlc;action=android.intent.action.VIEW;type=video/*;end"
        >
            ▶ Play in VLC
        </a>

        <br>

        <!-- Normal HTTP fallback -->
        <a
            class="button secondary"
            href="http://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282026%29/Spider-Man%20-%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V4%20%5BMulti%20Audio%5D/Spider-Man%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V3%20x264%20ESub%20%5BMulti%20Audio%5D%5BHindi%20%28Clean%29%2BEnglish%20CAM%2BMulti%20CAM%5D%20-HDHub.mkv"
        >
            Open Movie Link
        </a>

    </div>

    <p class="note">
        If VLC does not open, make sure VLC is installed and connected to the same network as the movie server.
    </p>

</div>

</body>
  </html>
