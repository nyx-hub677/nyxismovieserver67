<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;

            background: #1c1c1c;

            padding: 30px 20px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .description {
            color: #bbb;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .movie {
            padding: 22px 18px;

            background: #292929;

            border-radius: 12px;
        }

        .movie h2 {
            margin: 0 0 10px;

            font-size: 21px;
            line-height: 1.4;
        }

        .movie-info {
            color: #aaa;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .button {
            display: inline-block;

            width: 90%;
            max-width: 320px;

            margin-top: 10px;

            padding: 13px 22px;

            color: white;
            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            transition: opacity 0.2s ease;
        }

        .button:hover {
            opacity: 0.8;
        }

        .vlc {
            background: orange;
        }

        .fallback {
            background: #555;
        }

        .note {
            margin-top: 25px;

            color: #777;

            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Movie Server</h1>

    <p class="description">
        Click the button below to play the movie directly in the VLC app.
    </p>

    <div class="movie">

        <h2>
            Spider-Man: Brand New Day (2026)
        </h2>

        <p class="movie-info">
            HDTC • 720p • Multi Audio
        </p>


        <!-- PLAY IN VLC -->

        <a
            class="button vlc"
            href="intent://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282026%29/Spider-Man%20-%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V4%20%5BMulti%20Audio%5D/Spider-Man%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V3%20x264%20ESub%20%5BMulti%20Audio%5D%5BHindi%20%28Clean%29%2BEnglish%20CAM%2BMulti%20CAM%5D%20-HDHub.mkv#Intent;scheme=http;package=org.videolan.vlc;end"
        >
            ▶ Play in VLC
        </a>


        <br>


        <!-- OPEN DIRECT MOVIE URL -->

        <a
            class="button fallback"
            href="http://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282026%29/Spider-Man%20-%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V4%20%5BMulti%20Audio%5D/Spider-Man%20Brand%20New%20Day%20%282026%29%20720p%20HDTC%20V3%20x264%20ESub%20%5BMulti%20Audio%5D%5BHindi%20%28Clean%29%2BEnglish%20CAM%2BMulti%20CAM%5D%20-HDHub.mkv"
        >
            Open Movie Link
        </a>

    </div>


    <p class="note">
        VLC must be installed on your Android device and your device must
        be connected to the same network as the movie server.
    </p>

</div>

</body>
</html>
