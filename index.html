<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background: #1c1c1c;
            padding: 30px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #aaa;
            line-height: 1.6;
        }

        .movie-card {
            background: #292929;
            padding: 22px;
            border-radius: 14px;
        }

        .movie-title {
            margin: 0 0 10px;
            font-size: 21px;
            line-height: 1.4;
        }

        .movie-info {
            margin: 0 0 22px;
            color: #aaa;
            font-size: 14px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin-top: 10px;
            border-radius: 9px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .vlc {
            background: orange;
        }

        .browser {
            background: #555;
        }

        .note {
            margin: 24px 0 0;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>My Movie Server</h1>

        <p class="subtitle">
            Select an option below to watch the movie.
        </p>

        <section class="movie-card">

            <h2 class="movie-title">
                Spider-Man 3 (2007)
            </h2>

            <p class="movie-info">
                720p • BluRay • Dual Audio
            </p>

            <!-- Play directly in VLC -->
            <a
                class="button vlc"
                href="intent://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282007%29/Spider-Man%203%20%282007%29%20720p%20%5BDual%20Audio%5D/Spider-Man%203%20%282007%29%20720p%20BluRay%20x264%20ESub%20%5BDual%20Audio%5D%5BHindi%205.1%2BEnglish%205.1%5D%20-%20mkvC.mkv#Intent;scheme=http;package=org.videolan.vlc;end"
            >
                ▶ Play in VLC
            </a>

            <!-- Open the movie URL directly -->
            <a
                class="button browser"
                href="http://172.16.50.7/DHAKA-FLIX-7/English%20Movies/%282007%29/Spider-Man%203%20%282007%29%20720p%20%5BDual%20Audio%5D/Spider-Man%203%20%282007%29%20720p%20BluRay%20x264%20ESub%20%5BDual%20Audio%5D%5BHindi%205.1%2BEnglish%205.1%5D%20-%20mkvC.mkv"
            >
                Open Movie Link
            </a>

        </section>

        <p class="note">
            VLC must be installed on your Android device and connected
            to the same network as the movie server.
        </p>

    </main>

</body>
</html>
