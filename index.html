<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#6e6e6e;
      font-family:Arial, sans-serif;
    }

    .box{
      background:#111;
      padding:30px;
      border-radius:16px;
      width:300px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    h2{
      color:white;
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#222;
      color:white;
      margin-bottom:15px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#444;
      color:white;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      background:#666;
    }

    ##result{
  position:fixed;
  bottom:10px;
  left:0;
  width:100%;
  text-align:center;
  color:#111;
  font-size:12px;
}
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Enter Password</h2>

    <input type="password" id="password" placeholder="Current password">

    <button onclick="savePassword()">Submit</button>

    <div id="result"></div>
  </div>

  <script>
    function savePassword() {
      const pass = document.getElementById("password").value;

      // ONLY stored temporarily in browser memory
      document.getElementById("result").innerText =
        "You entered: " + pass;
    }
  </script>

</body>
</html>
